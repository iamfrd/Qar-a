name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Təmiz quraşdırma
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tip yoxlaması və build
        run: npm run build

      - name: Bazanı hazırla
        run: npm run db:reset

      - name: İnteqrasiya testləri
        run: npm test
