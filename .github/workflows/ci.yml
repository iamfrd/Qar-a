name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Must stay >=22.12.0: oxlint's platform bindings declare that engines range, and
          # npm silently skips an optional dependency whose engines do not match, which made
          # every Lint run fail with "Cannot find native binding" on the old 22.5.0 pin.
          # Pinned to the version the project is developed against so CI and local agree.
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Claude configuration
        run: npm run validate:claude

      - name: Audit Claude skill structure
        run: npm run skill:audit

      - name: Review skill evolution state
        run: npm run skill-evolution:review

      - name: Validate Qarğa Work OS
        run: npm run work-os:validate

      - name: Review Qarğa Work OS integrity
        run: npm run work-os:review

      - name: Test Claude agent system
        run: npm run test:claude-system

      - name: Scan Claude configuration security
        run: npm run security:claude

      - name: Check Claude system health
        run: npm run system:health -- --ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Prepare test database
        run: npm run db:reset

      - name: Run integration tests
        run: npm test
